name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install exactly the committed dependency tree
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run verify
      - name: Verify experimental UI archive
        if: matrix.node == 22
        run: pnpm run pack:ui-experimental
